name: splat-beta
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cuda-toolkit=11.8
  - colmap
  - ffmpeg
  - pip:
      # core 3DGS stack
      - torch==2.1.2+cu118
      - torchvision==0.16.2+cu118
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - nerfstudio==1.1.5
      - gsplat>=1.0.0
      # frame processing
      - opencv-python>=4.10
      - numpy<2.0
      - tqdm
      - pillow
      # control panel (ui/app.py)
      - streamlit>=1.37
      - pandas>=2.0
      # foundation-model pose estimators (added as we test them)
      # LingBot-Map / VGGT installs typically need their own venvs;
      # see pipeline/run_lingbot.sh for separate setup instructions

# NOTE for Windows users:
# - COLMAP must be installed separately on Windows (conda colmap channel is Linux/Mac only).
#   Download from https://colmap.github.io and add to PATH.
# - PyTorch+CUDA install on Windows works via the pip block above.
# - If conda env creation fails on the cuda-toolkit line, install CUDA 11.8 system-wide
#   from nvidia.com and remove the cuda-toolkit dependency here.
